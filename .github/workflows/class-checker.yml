name: Class Announcement Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-announcements:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checker/package-lock.json

      - name: Install dependencies
        working-directory: checker
        run: npm ci

      - name: Create Firebase service account
        working-directory: checker
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > serviceAccountKey.json

      - name: Run class announcement checker
        working-directory: checker
        run: node index.js
